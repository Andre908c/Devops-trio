<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcial - Integrantes del Grupo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #contenedor-nombres {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <button id="btn-nombres">Nombres</button>
    <div id="contenedor-nombres"></div>

    <script>
        function mostrarNombres() {
            const contenedor = document.getElementById("contenedor-nombres");
            contenedor.innerHTML = `
                <h3>Integrantes del grupo:</h3>
                <ul>
                    <li>Daniel Blandón</li>
                    <li>Andrés Juan</li>
                </ul>
            `;
        }

        // Asignamos el evento desde JavaScript en lugar del onclick en el HTML
        document.getElementById("btn-nombres").addEventListener("click", mostrarNombres);
    </script>

</body>
</html>
